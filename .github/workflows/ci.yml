name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly: surface ecosystem drift on quiet repos

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: gojiplus/py-canon/.github/workflows/reusable-ci.yml@v1
    with:
      # requires-python floors at 3.12, so the reusable default of 3.11 cannot resolve.
      python-versions: '["3.12", "3.14"]'
      wheel-import: lost_years
      # Measured 79% on this branch; one point of headroom.
      coverage-floor: 78
      run-preen: true
